<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C63">
<title>Linhagem — Gestão de Plantel e Germoplasma</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--pri:#0F5C63;--pri2:#0B4449;--acc:#E8833A;--bg:#F3F6F5;--card:#fff;--tx:#14262A;--mut:#5E7276;--ln:#DCE4E3;--ok:#2E7D4F;--err:#B3261E;--warn:#B26A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#0F5C63,#0B4449);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header img{width:34px;height:34px;border-radius:9px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:17px}
header .t small{opacity:.8;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap;border:0;color:#fff}
.sync{border:1px solid rgba(255,255,255,.45)!important;font-weight:600;cursor:pointer;min-height:34px}.sync.pend{background:var(--acc);border-color:var(--acc)!important}
.gira{display:inline-block}.gira.on{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.bsync{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin:0 0 12px}.bsync.pend{border-color:var(--acc);background:#FFF6EE}.bsync b{display:block;font-size:14px}.bsync small{color:var(--mut);font-size:12px}.bsync .btn{min-height:40px;padding:8px 12px;white-space:nowrap;width:auto}
.sync.off{background:#6b4a2a}
main{padding:14px;padding-bottom:170px;max-width:860px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri);font-weight:600}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--pri2)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #C7D3D2;border-radius:10px;background:#fff;color:var(--tx);min-height:48px}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(15,92,99,.25);border-color:var(--pri)}
.busca{font-size:22px;letter-spacing:1px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:600 16px system-ui,sans-serif;padding:12px 16px;min-height:48px;cursor:pointer}
.btn.sec{background:#E4ECEB;color:var(--pri2)}
.btn.acc{background:var(--acc)}
.btn.w{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #C7D3D2;background:#fff;border-radius:99px;padding:10px 14px;font:500 15px system-ui,sans-serif;min-height:44px;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--ln);cursor:pointer}
.item:last-child{border-bottom:0}
.item .m{flex:1;min-width:0}
.item .s{font-size:13px;color:var(--mut)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.chipnum{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--mut)}
.chipnum b{color:var(--tx);font-size:18px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#E4ECEB;color:var(--pri2);margin-right:4px}
.tag.M{background:#DCEAF7;color:#1C4E80}.tag.F{background:#F9E1D2;color:#8A3E12}.tag.I{background:#EEE;color:#555}
.tag.bad{background:#F6D9D6;color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:26px;color:var(--pri)}
.kpi span{font-size:13px;color:var(--mut)}
.tl{border-left:3px solid var(--ln);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;padding:6px 0 12px}
.tl .ev:before{content:"";position:absolute;left:-21px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
.tl .ev small{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:12px}
.bar{height:8px;background:#E4ECEB;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.hi{background:var(--err)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:92%;font-size:17px;font-weight:600;background:#14262A;color:#fff;padding:12px 16px;border-radius:12px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.toast.ok{background:var(--ok)}
.alert{background:#FFF4E0;border:1px solid #F2C77E;color:#6A4300;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.alert.err{background:#FBE9E7;border-color:#EBA59E;color:var(--err)}
.mut{color:var(--mut);font-size:14px}
.big{font-size:24px;font-weight:700}
.sel{background:#EAF4F3;border:2px solid var(--pri);border-radius:14px;padding:12px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hide{display:none!important}
.passo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--pri2);margin-bottom:10px}.passo span{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.splash{text-align:center;padding:28px 10px 6px}.splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(8,58,64,.35)}
.splash h1{margin:14px 0 2px;font-size:28px;color:var(--pri2);letter-spacing:-.5px}.splash p{margin:0;color:var(--mut)}
.hero{background:linear-gradient(160deg,#11606A,#083A40);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero label{color:#CFE7E4}.hero input{border:0}
.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.acao{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 6px;text-align:center;font:600 13px system-ui,sans-serif;color:var(--pri2);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.acao span{font-size:24px;line-height:1}
.st{font-size:12px;padding:2px 8px;border-radius:99px}.st.Nova{background:#FFF0D6;color:#8A5A00}.st.Em{background:#DCEAF7;color:#1C4E80}.st.Feita{background:#DDF1E4;color:#1E6B3C}.st.Descartada{background:#EEE;color:#666}
a.lk{color:var(--pri);font-weight:600;cursor:pointer;text-decoration:none}
details summary{cursor:pointer;color:var(--pri);font-weight:600;padding:6px 0}
@media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}.card{break-inside:avoid;border-color:#bbb}}
.barSalvar{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:4;background:#fff;border-top:1px solid var(--ln);box-shadow:0 -6px 18px rgba(8,58,64,.08);display:flex;gap:10px;align-items:center;padding:8px 14px}.bsInfo{flex:1;min-width:0}.bsInfo b{display:block;font-size:14px}.bsInfo small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barSalvar .btn{width:auto;min-height:46px;padding:10px 16px;white-space:nowrap}
.voltar{display:flex;justify-content:space-between;margin:-4px 0 6px}.voltar button{background:none;border:0;color:var(--pri);font:600 15px inherit;font-family:inherit;padding:8px 2px;min-height:40px;cursor:pointer}
</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="" onclick="if(user)ir('inicio')" style="cursor:pointer" title="Início">
  <div class="t"><b id="hNome">Linhagem</b><small>Gestão de Plantel e Germoplasma</small></div>
  <button class="sync" id="syncBtn" onclick="sincronizar(true)">…</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script src="regras.js"></script>
<script>
// ===================== Armazenamento local =====================
const LS = {
  get(k, d) { try { const v = localStorage.getItem('plantel_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('plantel_' + k, JSON.stringify(v)); } catch (e) { toast('A memória do aparelho está cheia. Sincronize assim que possível.', 'err'); } }
};
// Base, fila e recusados podem ficar grandes: vão para o IndexedDB (centenas de MB), com cópia na memória
const GRANDES = ['base', 'fila', 'recusados'];
const IDB = {
  db: null,
  abrir() { return new Promise((ok, no) => { const r = indexedDB.open('linhagem', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; ok(); }; r.onerror = () => no(r.error); }); },
  ler(k) { return new Promise(ok => { try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); } catch (e) { ok(undefined); } }); },
  gravar(k, v) { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.onerror = () => toast('Não consegui guardar no aparelho: ' + (t.error && t.error.message), 'err'); } catch (e) { LS.set(k, v); } }
};
async function carregarArmazenamento() {
  try {
    await IDB.abrir();
    for (const k of GRANDES) {
      let v = await IDB.ler(k);
      if (v === undefined) { v = LS.get(k, undefined); if (v !== undefined) { IDB.gravar(k, v); try { localStorage.removeItem('plantel_' + k); } catch (e) {} } } // migra do armazenamento antigo
      if (v !== undefined) { if (k === 'base') base = v; if (k === 'fila') fila = v; if (k === 'recusados') recusados = v; }
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { IDB.db = null; } // sem IndexedDB: segue no localStorage
}
function guardarGrande(k, v) { if (IDB.db) IDB.gravar(k, v); else LS.set(k, v); }
let cfg = LS.get('cfg', { url: '', chave: '', nome: 'Linhagem' });
let user = LS.get('user', null);
let base = null;       // última cópia recebida do servidor
let fila = [];         // lançamentos ainda não enviados
let recusados = [];
let S = novoEstado();
let tela = 'inicio', telaArg = null;
let syncDeNovo = false, sincronizando = false, ultimaSync = LS.get('ultimaSync', ''), erroSync = LS.get('erroSync', null);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoje = () => new Date().toISOString().slice(0, 10);
const fData = d => { if (!d) return ''; const x = String(d).slice(0, 10).split('-'); return x.length === 3 ? x[2] + '/' + x[1] + '/' + x[0] : d; };
const $ = id => document.getElementById(id);
const SEXO = { M: 'Macho', F: 'Fêmea', I: 'Indefinido' };

function recalcular() {
  S = base ? clone(base.estado) : novoEstado();
  S.usados = S.usados || {};
  fila.forEach(ev => { try { aplicar(S, ev); delete ev._erro; } catch (e) { ev._erro = e.message; } });
}
function salvarLocal() { guardarGrande('fila', fila); guardarGrande('recusados', recusados); guardarGrande('base', base); }

// Registra um ou vários lançamentos: valida no aparelho, guarda na fila e tenta enviar
function lancar(eventos) {
  for (const e of eventos) { const m = podeLancar(user && user.perfil, e); if (m) throw new Error(m); }
  const teste = clone(S);
  for (const ev of eventos) aplicar(teste, ev); // lança erro se alguma regra for violada
  fila.push(...eventos);
  S = teste;
  salvarLocal();
  atualizarSync();
  setTimeout(() => sincronizar(), 300);
}
function ev(tipo, p) { return { uid: uid(), tipo, ts: new Date().toISOString(), user: user ? user.nome : '', p }; }

// ===================== Sincronização =====================
function auth() { return user && user.token ? { chave: cfg.chave, user: user.nome, token: user.token } : { chave: cfg.chave, user: user && user.nome, pin: user && user.pin }; }
async function chamar(body) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}
async function sincronizar(manual) {
  if (!cfg.url) { if (manual) toast('Modo demonstração: os dados ficam só neste aparelho. Configure o servidor em Mais → Configurações.'); return; }
  if (!navigator.onLine) { if (manual) toast('Sem internet. Os lançamentos ficam guardados e serão enviados depois.'); return; }
  if (sincronizando) { syncDeNovo = true; return; } // termina o envio atual e envia de novo
  sincronizando = true; syncDeNovo = false; atualizarSync();
  try {
    const enviar = fila.slice(0, 100).map(e => { const c = { ...e }; delete c._erro; return c; }); // em lotes: importações grandes não estouram o tempo do servidor
    if (fila.length > 100) syncDeNovo = true;
    if (!user || !user.token) { if (manual) toast('Entre com seu e-mail e PIN para sincronizar.'); return; }
    const r = await chamar({ ...auth(), eventos: enviar });
    if (!r.ok) { if (/Sessão encerrada/.test(r.erro)) { user = null; LS.set('user', null); render(); } throw new Error(r.erro); }
    const res = {}; (r.resultados || []).forEach(x => res[x.uid] = x);
    const nova = [];
    fila.forEach(e => {
      const x = res[e.uid];
      if (!x) nova.push(e);
      else if (!x.ok) recusados.unshift({ ...e, erro: x.erro, em: new Date().toISOString() });
    });
    const nRec = fila.length - nova.length - Object.values(res).filter(x => x.ok).length;
    fila = nova;
    base = r.foto;
    ultimaSync = new Date().toISOString(); LS.set('ultimaSync', ultimaSync); erroSync = null; LS.set('erroSync', null);
    salvarLocal(); recalcular(); render();
    if (nRec > 0) toast(nRec + ' lançamento(s) recusado(s) pelo servidor. Veja em Mais → Pendências.', 'err');
    else if (manual) toast('Sincronizado: tudo enviado e dados atualizados.', 'ok');
  } catch (e) {
    erroSync = { msg: e.message, em: new Date().toISOString() }; LS.set('erroSync', erroSync);
    if (manual) toast('Não foi possível sincronizar: ' + e.message + '. Veja em Mais → Sincronização.', 'err');
  } finally { sincronizando = false; atualizarSync(); if (syncDeNovo && fila.length) setTimeout(() => sincronizar(), 200); }
}
function atualizarSync() {
  const b = $('syncBtn');
  const n = fila.length;
  b.className = 'sync' + (n ? ' pend' : '') + (!navigator.onLine ? ' off' : '');
  const hora = ultimaSync ? new Date(ultimaSync).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  b.innerHTML = '<span class="gira' + (sincronizando ? ' on' : '') + '">⟳</span> ' + (sincronizando ? 'Enviando…' : !cfg.url ? 'Demonstração' + (n ? ' · ' + n : '') : n ? 'Enviar ' + n + (!navigator.onLine ? ' (sem sinal)' : '') : !navigator.onLine ? 'Sem sinal' : 'Sincronizar');
  b.title = cfg.url ? (n ? n + ' lançamento(s) aguardando envio. Toque para enviar agora.' : 'Tudo enviado' + (hora ? ' (última vez às ' + hora + ')' : '') + '. Toque para buscar as novidades.') : 'Modo demonstração: os dados ficam só neste aparelho.';
  const bar = $('barSync'); if (bar) bar.innerHTML = barraSync();
}
// faixa da tela inicial: situação da sincronização e botão grande
function barraSync() {
  if (!cfg.url) return `<div class="bsync"><div><b>Modo demonstração</b><small>Os dados ficam só neste aparelho.</small></div></div>`;
  const n = fila.length, hora = ultimaSync ? new Date(ultimaSync).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'ainda não';
  return `<div class="bsync ${n ? 'pend' : ''}"><div><b>${sincronizando ? 'Enviando…' : n ? n + ' lançamento(s) aguardando envio' : 'Tudo enviado'}</b><small>${navigator.onLine ? 'Última sincronização: ' + hora : 'Sem internet agora: os lançamentos ficam guardados e vão sozinhos quando o sinal voltar.'}</small></div><button class="btn ${n ? 'acc' : 'sec'}" onclick="sincronizar(true)" ${sincronizando ? 'disabled' : ''}>⟳ Sincronizar</button></div>${recusados.length || erroSync || n ? `<div class="alert ${recusados.length || erroSync ? 'err' : ''}" style="margin:-4px 0 12px;cursor:pointer" onclick="ir('pendencias')">${recusados.length ? '⚠ ' + recusados.length + ' lançamento(s) recusado(s) precisam de atenção. ' : ''}${erroSync && !recusados.length ? '⚠ O último envio falhou. ' : ''}<b>Ver o que está pendente ›</b></div>` : ''}`;
}
window.addEventListener('online', () => { atualizarSync(); sincronizar(); });
window.addEventListener('offline', atualizarSync);
setInterval(() => sincronizar(), 90000);

// ===================== Utilidades de tela =====================
function toast(msg, tipo) {
  try { if (tipo === 'ok' && navigator.vibrate) navigator.vibrate(80); if (tipo === 'err' && navigator.vibrate) navigator.vibrate([60, 60, 60]); } catch (e) {}
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast ' + (tipo || ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), tipo === 'err' ? 6000 : 3000);
}
function ir(t, arg, semHistorico) {
  if (t === 'lancar') { limparForm = true; L.data = hoje(); L.mudou = false; if (!arg) animalSel = null; }
  tela = t; telaArg = arg;
  // botão "voltar" do celular volta para a tela anterior do app, em vez de sair
  if (!semHistorico) { try { history.pushState({ t, arg }, ''); } catch (e) {} }
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => { if (!user) return; const st = e.state || { t: 'inicio' }; ir(st.t, st.arg, true); });
// tela "de cima" de cada subtela: é para lá que o link Voltar leva
function telaPai() {
  if (tela === 'editar') return ['ficha', telaArg, 'Ficha do animal'];
  if (tela === 'ficha') return ['animais', null, 'Animais'];
  if (tela === 'limpar') return ['importar', null, 'Importar dados'];
  if (['viveiros', 'canecas', 'importar', 'pedigree', 'config', 'pendencias', 'painel', 'sugestoes', 'usuarios', 'sair', 'cruzamento', 'meupin'].includes(tela)) return ['mais', null, 'Mais'];
  return null;
}
function viv(id) { const v = S.viveiros[id]; return v ? v.codigo : '—'; }
function vivOpts(sel, filtro) {
  return '<option value="">Selecione…</option>' + Object.values(S.viveiros).filter(v => !filtro || VIVEIRO_BLOQ.indexOf(v.status) < 0)
    .sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt', { numeric: true }))
    .map(v => `<option value="${v.id}" ${v.id === sel ? 'selected' : ''}>${esc(v.codigo)}${v.nome ? ' — ' + esc(v.nome) : ''}</option>`).join('');
}
function canOpts(sel) {
  return '<option value="">Selecione…</option>' + Object.values(S.canecas).sort((a, b) => (a.botijao + a.caneca).localeCompare(b.botijao + b.caneca, 'pt', { numeric: true }))
    .map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>Botijão ${esc(c.botijao)} · Caneca ${esc(c.caneca)}${c.cor ? ' (' + esc(c.cor) + ')' : ''}</option>`).join('');
}
function chipFmt(chip, n) {
  n = n || 5; chip = chip || '';
  return `<span class="chipnum">${esc(chip.slice(0, -n))}<b>${esc(chip.slice(-n))}</b></span>`;
}
function tagSexo(s) { return `<span class="tag ${s}">${SEXO[s] || s}</span>`; }
function ativo(a) { return INATIVOS.indexOf(a.status) < 0 && a.status !== 'Referência'; }

// Busca pelos últimos dígitos (ou chip completo / leitor RFID)
function buscar(q, todos) {
  q = String(q || '').trim().replace(/\s+/g, '');
  if (!q) return [];
  const lista = Object.values(S.animais).filter(a => todos || ativo(a));
  const exato = lista.filter(a => a.chip === normChip(q));
  if (exato.length) return exato;

function acharUm(q, sexo, rot) {
  if (!q) return '';
  const r = buscar(q, true).filter(x => !sexo || x.sexo === sexo);
  if (r.length === 1) return r[0].id;
  throw new Error(r.length ? `Mais de um animal termina com "${q}" para ${rot}. Digite mais dígitos.` : `${rot}: nenhum ${sexo === 'M' ? 'macho' : sexo === 'F' ? 'fêmea' : 'animal'} com chip terminando em "${q}".`);
}
function v(id) { const e = $(id); return e ? e.value.trim() : ''; }
function salvarLanc() {
  try {
    if (L.sub !== 'Novo animal (chipagem)' && !animalSel) { const q = $('qL'); if (q && q.value.trim()) { const r = buscar(q.value); if (r.length === 1) animalSel = r[0].id; } }
    if (L.sub !== 'Novo animal (chipagem)' && !animalSel) { const q = $('qL'); if (q) q.focus(); throw new Error('Escolha o animal no passo 2 (digite o final do chip e toque nele na lista).'); }
    const obs = v('fObs'), data = v('fData') || hoje();
    const dest = $('fDest') ? $('fDest').value : '';
    if (L.sub === 'Novo animal (chipagem)') {
      if (!dest) throw new Error('Escolha o viveiro onde o animal vai ficar.');
      const e = ev('animal_novo', { id: uid(), chip: v('nChip'), sexo: v('nSexo'), safra: v('nSafra'), classe: v('nClasse'), pai: acharUm(v('nPai'), 'M', 'Pai'), mae: acharUm(v('nMae'), 'F', 'Mãe'), viveiro: dest, data, obs });
      lancar([e]); toast('Animal ' + normChip(e.p.chip) + ' cadastrado.', 'ok');
      L.destino = dest; guardar(); limparForm = true; return telaLancar();
    }
    const a = S.animais[animalSel];
    const mudou = L.sub === 'Mudança de viveiro' ? true : (L.sub === 'Outro manejo' && OUTROS.slice(5).includes(L.outro) ? false : L.mudou);
    if (mudou && !dest) throw new Error('Escolha o viveiro de destino.');
    let dados = {};
    if (L.sub === 'Biometria') {
      dados = { peso: v('bPeso'), ct: v('bCT'), cp: v('bCP'), altura: v('bAlt') };
      const p = num(dados.peso), u = ultimaBiometria(S, a.id);
      if (p != null && (p < 5 || p > 40000) && !confirm('Peso de ' + p + ' g está fora do comum para tambaqui (o campo é em gramas). Confirmar mesmo assim?')) return;
      if (p != null && u && u.dados.peso && Math.abs(p - u.dados.peso) / u.dados.peso > 0.5 && !confirm('O peso mudou mais de 50% desde a última biometria (' + u.dados.peso + ' g → ' + p + ' g). Confirmar?')) return;
    }
    if (L.sub === 'Coleta de sêmen') { dados = { volume: v('sVol'), motilidade: v('sMot'), vigor: v('sVig'), conc: v('sConc'), diluidor: v('sDil'), doses: v('sDoses'), volDose: v('sVolD'), cor: v('sCor'), caneca: v('sCan') }; L.caneca = dados.caneca; }
    if (L.sub === 'Coleta de ovócitos') dados = { protocolo: v('oProt'), pesoDesova: v('oPeso'), fecundidade: v('oFec'), qualidade: v('oQual'), destinoDesova: v('oDest'), lote: v('oDest') === 'Fertilização' ? v('oLote') : '', dosesUsadas: v('oDoses'), macho: v('oDest') === 'Fertilização' ? v('oMacho') : '' };
    if (L.sub === 'Rechipagem') dados = { novoChip: v('rChip'), motivo: v('rMot') };
    if (L.sub === 'Outro manejo') { if (!L.outro) throw new Error('Escolha qual manejo.'); dados = { qual: L.outro, detalhe: v('xDet') }; }
    if (a.sexo === 'F' && L.sub === 'Coleta de sêmen') throw new Error('Coleta de sêmen só pode ser feita em Macho.');
    if (a.sexo === 'M' && L.sub === 'Coleta de ovócitos') throw new Error('Coleta de ovócitos só pode ser feita em Fêmea.');
    if (a.sexo === 'I' && (L.sub === 'Coleta de sêmen' || L.sub === 'Coleta de ovócitos') && !confirm('O sexo deste animal está Indefinido. Confirmar que é ' + (L.sub === 'Coleta de sêmen' ? 'Macho' : 'Fêmea') + '?')) return;
    lancar([ev('atividade', { animal: a.id, sub: L.sub, dados, mudou, destino: mudou ? dest : '', origemEsperada: a.viveiro, data, obs, confirmaSexo: true })]);
    if (mudou) L.destino = dest;
    guardar();
    toast(L.sub + ' salva para …' + a.chip.slice(-5) + (mudou ? ' · foi para ' + viv(dest) : ''), 'ok');
    animalSel = null; limparForm = true;
    if (L.lote) telaLancar(); else ir('ficha', a.id);
  } catch (e) { toast(e.message, 'err'); }
}

  const safra = v('pSafra'), modo = v('pId'), zero = $('pZero').value, fmt = v('pFmt');
  const inc = new Set();
  const add = id => { if (!id || inc.has(id) || !S.animais[id]) return; inc.add(id); add(S.animais[id].pai); add(S.animais[id].mae); };
  Object.values(S.animais).filter(a => !safra || a.safra === safra).forEach(a => add(a.id));
  const ordem = [], feito = new Set();
  const visita = id => { if (!id || feito.has(id) || !inc.has(id)) return; feito.add(id); visita(S.animais[id].pai); visita(S.animais[id].mae); ordem.push(id); };
  [...inc].sort((a, b) => String(S.animais[a].safra).localeCompare(String(S.animais[b].safra))).forEach(visita);
  const num = {}; ordem.forEach((id, i) => num[id] = i + 1);
  const rot = id => !id || !inc.has(id) ? zero : modo === 'num' ? num[id] : S.animais[id].chip;
  const sep = fmt === 'csv' ? ',' : fmt === 'tab' ? '\t' : ' ';
  const linhas = [['ID', 'ID_PAI', 'ID_MAE'].join(sep)].concat(ordem.map(id => [rot(id), rot(S.animais[id].pai), rot(S.animais[id].mae)].join(sep)));
  baixar('pedigree' + (safra ? '_safra_' + safra : '') + (fmt === 'csv' ? '.csv' : '.txt'), linhas.join('\n'));
  if (modo === 'num') baixar('pedigree_chave_ids.csv', ['ID,CHIP'].concat(ordem.map(id => num[id] + ',' + S.animais[id].chip)).join('\n'));
}
function baixar(nome, txt) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = nome; a.click(); }

function oQueFazer(msg) {
  msg = String(msg || '');
  if (/já está ativo/.test(msg)) return 'Outro aparelho já cadastrou esse chip. Abra a ficha do animal que já existe; se este cadastro foi engano, descarte-o.';
  if (/Outra pessoa já mudou/.test(msg)) return 'Alguém já mudou este peixe de viveiro. Confira o viveiro atual na ficha e, se ainda precisar, lance a mudança de novo.';
  if (/Sessão encerrada|PIN/.test(msg)) return 'Entre de novo com seu e-mail e PIN. Os lançamentos continuam guardados.';
  if (/administrador|perfil/i.test(msg)) return 'Seu perfil não permite este lançamento. Peça ao administrador para fazer.';
  if (/dose/.test(msg)) return 'O lote não tem doses suficientes. Confira o estoque de sêmen e lance com a quantidade certa.';
  if (/não encontrad/i.test(msg)) return 'O animal ou lote não existe mais no servidor (pode ter sido anulado). Confira na ficha.';
  if (/status|não pode receber/.test(msg)) return 'O animal está com baixa (óbito, descarte ou transferência). Se a baixa foi engano, o administrador reverte na ficha.';
  if (/viveiro/i.test(msg)) return 'O viveiro de destino não pode receber animais (inativo ou em vazio sanitário). Escolha outro.';
  if (/safra|pai|mãe|sexo/i.test(msg)) return 'Há um problema na genealogia ou no sexo. Confira os pais e a safra na ficha.';
  if (/Failed to fetch|NetworkError|conectar|fora/i.test(msg)) return 'Não houve conexão com o servidor. Confira a internet e toque em Sincronizar agora; nada se perde.';
  return 'Confira os dados e lance de novo. Se o erro repetir, toque em "Relatar" para avisar quem mantém o sistema.';
}

    <label>Em qual parte do sistema?</label><select id="sgTela">${telas.map(t => `<option>${t}</option>`).join('')}</select>
    <label>Descrição</label><textarea id="sgTxt" rows="4" placeholder="Ex.: incluir temperatura da água na biometria"></textarea>
    <div style="height:12px"></div><button class="btn acc w" onclick="enviarSugestao()">Enviar</button></div>
    <h3>Registradas (${lista.length})</h3>
    <div class="card" style="padding:4px 12px">${lista.map(x => `<div class="item" style="cursor:default;align-items:flex-start"><div class="m">
      <div><span class="tag">${esc(x.tipo)}</span><span class="st ${esc(String(x.status).split(' ')[0])}">${esc(x.status)}</span> <small class="mut">${esc(x.tela)}</small></div>
      <div style="margin:6px 0">${esc(x.texto)}</div>
      <div class="s">${esc(x.user)} · ${new Date(x.data).toLocaleDateString('pt-BR')}</div>
      ${x.resposta ? `<div class="alert" style="margin:6px 0 0">Resposta: ${esc(x.resposta)}</div>` : ''}
      ${user.perfil === 'Administrador' ? `<div class="noprint" style="margin-top:6px"><select style="min-height:36px;padding:6px;width:auto" onchange="mudarSug('${x.id}',this.value)">${['Nova', 'Em andamento', 'Feita', 'Descartada'].map(o => `<option ${x.status === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>` : ''}
    </div></div>`).join('') || '<p class="mut">Nenhuma ainda.</p>'}</div>`;
}
function enviarSugestao() {
  try { lancar([ev('sugestao', { tipo: $('tgC').classList.contains('on') ? 'Correção' : 'Melhoria', tela: v('sgTela'), texto: v('sgTxt') })]); toast('Enviado. Obrigado!', 'ok'); telaSugestoes(); }
  catch (e) { toast(e.message, 'err'); }
}
function mudarSug(id, st) { try { lancar([ev('sugestao_status', { id, status: st })]); telaSugestoes(); } catch (e) { toast(e.message, 'err'); } }

// ===================== Início do app =====================
// Link de configuração: ...index.html?s=<URL do servidor>&k=<chave> já deixa o celular pronto
(function () {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('s')) { cfg.url = q.get('s'); cfg.chave = q.get('k') || cfg.chave; LS.set('cfg', cfg); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();
carregarArmazenamento().then(() => {
  recalcular();
  render();
  sincronizar();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
